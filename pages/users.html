<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUTraveler - Quản lý người dùng</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../assets/css/global.css">
	<link rel="stylesheet" href="../assets/css/users.css">
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar">
			<h1 class="brand">DUTraveler</h1>

			<nav class="side-nav" aria-label="Sidebar navigation">
				<a class="nav-item" href="feed.html">
					<i class="bx bx-home-alt-2"></i>
					<span class="nav-label">Trang chủ</span>
				</a>

				<a class="nav-item" href="profile.html">
					<i class="bx bx-user"></i>
					<span class="nav-label">Trang cá nhân</span>
				</a>

				<a class="nav-item" href="reports.html">
					<i class="bx bx-shield-quarter"></i>
					<span class="nav-label">Quản lý báo cáo</span>
				</a>

				<a class="nav-item active" href="users.html">
					<i class="bx bx-group"></i>
					<span class="nav-label">Quản lý người dùng</span>
				</a>

				<a class="nav-item" href="settings.html">
					<i class="bx bx-cog"></i>
					<span class="nav-label">Cài đặt</span>
				</a>
			</nav>
		</aside>

		<main class="main-content users-main">
			<section class="users-page" aria-label="Trang quản lý người dùng">
				<header class="users-header">
					<h1>Quản lý người dùng</h1>
					<p>Theo dõi tài khoản và xử lý các người dùng vi phạm trong hệ thống.</p>
				</header>

				<section class="users-table-card" aria-label="Danh sách người dùng">
					<div class="users-table-toolbar">
						<span id="users-count-badge" class="users-count-badge">0 người dùng</span>
					</div>

					<div class="users-table-scroll">
						<table class="users-table">
							<thead>
								<tr>
									<th scope="col">STT</th>
									<th scope="col">Avatar</th>
									<th scope="col">Username</th>
									<th scope="col">Nickname</th>
									<th scope="col">Email</th>
									<th scope="col">Role</th>
									<th scope="col">Hành động</th>
								</tr>
							</thead>
							<tbody id="users-tbody"></tbody>
						</table>
					</div>

					<p id="users-empty-state" class="users-empty-state is-hidden">Không có người dùng nào để hiển thị.</p>
				</section>
			</section>
		</main>
	</div>

	<script src="../assets/js/pages/users.js"></script>
</body>
</html>
