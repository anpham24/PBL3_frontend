<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUTraveler - Quản lý người dùng</title>
	<meta name="description" content="Trang quản lý tài khoản người dùng, đổi vai trò, khóa hoặc ban tài khoản vi phạm.">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../assets/css/global.css">
	<link rel="stylesheet" href="../assets/css/users.css">
	<link rel="stylesheet" href="../assets/css/modals.css">
</head>
<body>
	<div class="app-shell">
		<!-- sidebar injected by assets/js/components/sidebar.js -->

		<main class="main-content users-main">
			<section class="users-page" aria-label="Trang quản lý người dùng">
				<header class="users-header">
					<h1>Quản lý người dùng</h1>
					<p>Theo dõi tài khoản và xử lý các người dùng vi phạm trong hệ thống.</p>
				</header>

				<section class="users-table-card" aria-label="Danh sách người dùng">
					<div class="users-table-toolbar">
						<label class="users-search" for="users-search-input">
							<i class="bx bx-search" aria-hidden="true"></i>
							<input
								id="users-search-input"
								type="search"
								placeholder="Tìm kiếm người dùng..."
								autocomplete="off"
								aria-label="Tìm kiếm người dùng theo từ khóa"
							>
						</label>
						<span id="users-count-badge" class="users-count-badge" aria-live="polite">0 người dùng</span>
					</div>

					<p
						id="users-status"
						class="users-status is-hidden"
						role="status"
						aria-live="polite"
					></p>

					<div class="users-table-scroll">
						<table class="users-table" aria-label="Danh sách tài khoản người dùng">
							<thead>
								<tr>
									<th scope="col">STT</th>
									<th scope="col">Tài khoản</th>
									<th scope="col">Tên đăng nhập</th>
									<th scope="col">Vai trò</th>
									<th scope="col">Trạng thái</th>
									<th scope="col">Lịch sử vi phạm</th>
								</tr>
							</thead>
							<tbody id="users-tbody"></tbody>
						</table>
					</div>

					<p id="users-empty-state" class="users-empty-state is-hidden" role="status">
						Không có người dùng nào để hiển thị.
					</p>


				</section>
			</section>
		</main>
	</div>

	<!-- Modals injected dynamically by JS components -->

	<script type="module" src="../assets/js/components/sidebar.js"></script>
	<script type="module" src="../assets/js/pages/users.js"></script>
</body>
</html>
