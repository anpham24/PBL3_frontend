<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUTraveler - Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">
    <section class="login-wrapper" aria-label="Form đăng nhập DUTraveler">
        <h1 class="logo">DU<span>Traveler</span></h1>

        <div class="field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 20C4.96 16.93 7.93 15 12 15C16.07 15 19.04 16.93 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="text" placeholder="Tên người dùng hoặc Email" autocomplete="username" required>
        </div>

        <div class="field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 11V8.5C8 6.01 10.01 4 12.5 4C14.99 4 17 6.01 17 8.5V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
        </div>

        <button class="login-button" type="button">Đăng nhập</button>

        <a class="forgot-link" href="#">Quên mật khẩu?</a>

        <p class="account-footer">
            Bạn chưa có tài khoản?
            <a href="#">Đăng ký</a>
        </p>
    </section>
</body>
</html>
