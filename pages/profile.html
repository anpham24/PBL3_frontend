<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUTraveler - Trang cá nhân</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../assets/css/global.css">
	<link rel="stylesheet" href="../assets/css/profile.css">
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar">
			<h1 class="brand">DUTraveler</h1>

			<nav class="side-nav" aria-label="Sidebar navigation">
				<a class="nav-item" href="feed.html">
					<i class="bx bx-home-alt-2"></i>
					<span class="nav-label">Trang chủ</span>
				</a>

				<a class="nav-item create-post-link" href="feed.html">
					<i class="bx bx-plus-circle"></i>
					<span class="nav-label">Tạo bài đăng</span>
				</a>

				<a class="nav-item active" href="profile.html">
					<i class="bx bx-user"></i>
					<span class="nav-label">Trang cá nhân</span>
				</a>

				<a class="nav-item" href="notifications.html">
					<i class="bx bx-bell"></i>
					<span class="nav-label">Thông báo</span>
				</a>

				<a class="nav-item" href="settings.html">
					<i class="bx bx-cog"></i>
					<span class="nav-label">Cài đặt</span>
				</a>
			</nav>
		</aside>

		<main class="main-content">
			<header class="top-header">
				<div class="header-inner">
					<div class="search-wrap">
						<label class="search-box" for="search-input">
							<i class="bx bx-search"></i>
							<input id="search-input" type="search" placeholder="Tìm kiếm">
						</label>
					</div>
				</div>
			</header>

			<section class="main-inner">
				<div class="profile-page">
					<header class="profile-header">
						<img id="profile-avatar" class="profile-avatar" src="" alt="Avatar">

						<div class="profile-info">
							<div class="profile-top-row">
								<h2 id="profile-nickname" class="profile-username"></h2>
								<button id="profile-follow-button" class="follow-btn" type="button">Follow</button>
							</div>

							<div class="profile-stats">
								<p><strong id="profile-posts-count">0</strong> posts</p>
								<p><strong id="profile-followers-count">0</strong> followers</p>
								<p><strong id="profile-following-count">0</strong> following</p>
							</div>

							<p id="profile-bio" class="profile-bio"></p>
							<a id="profile-link" class="profile-link is-hidden" href="#" target="_blank" rel="noopener noreferrer"></a>
						</div>
					</header>

					<p id="profile-feedback" class="profile-feedback is-hidden" role="status" aria-live="polite"></p>

					<nav class="profile-tabs" aria-label="Profile tabs">
						<button class="profile-tab active" type="button">
							<i class="bx bx-grid-alt"></i>
							<span>Posts</span>
						</button>
						<button class="profile-tab" type="button">
							<i class="bx bx-bookmark"></i>
							<span>Saved</span>
						</button>
					</nav>

					<div class="profile-grid">
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 1">
							<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=70" alt="Mountain landscape">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 2">
							<img src="https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=900&q=70" alt="Tropical sea view">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 3">
							<img src="https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&w=900&q=70" alt="Street in old town">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 4">
							<img src="https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=900&q=70" alt="River and mountains">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 5">
							<img src="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?auto=format&fit=crop&w=900&q=70" alt="Architecture and sky">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 6">
							<img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=70" alt="Foggy forest valley">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 7">
							<img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=70" alt="Sun rays in forest">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 8">
							<img src="https://images.unsplash.com/photo-1503220317375-aaad61436b1b?auto=format&fit=crop&w=900&q=70" alt="Beach and cliffs">
						</a>
						<a class="grid-item" href="#" aria-label="Ảnh bài đăng 9">
							<img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?auto=format&fit=crop&w=900&q=70" alt="Sunset over ocean">
						</a>
					</div>
				</div>
			</section>
		</main>
	</div>

	<!-- create-post-modal injected by assets/js/components/create-post-modal.js -->
	<!-- comment-modal injected by assets/js/components/comment-modal.js -->

	<script type="module" src="../assets/js/components/sidebar.js"></script>
	<script type="module" src="../assets/js/pages/profile.js"></script>
</body>
</html>
