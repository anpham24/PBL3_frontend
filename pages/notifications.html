<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUTraveler - Thông báo</title>
	<meta name="description" content="Xem tất cả thông báo của bạn trên DUTraveler — lượt thích, bình luận, người theo dõi mới và bài đăng mới.">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../assets/css/global.css">
	<link rel="stylesheet" href="../assets/css/notifications.css">
</head>
<body>
	<div class="app-shell">
		<!-- sidebar injected by assets/js/components/sidebar.js -->

		<main class="main-content">
			<section class="main-inner">
				<section class="notifications-page" aria-label="Danh sách thông báo">
					<h2 class="notifications-title">Thông báo</h2>

					<!-- Danh sách thông báo — được render hoàn toàn bởi notifications.js -->
					<div id="notifications-list" class="notifications-list" aria-live="polite" aria-label="Thông báo">
						<!-- Notifications dynamically injected here -->
					</div>

					<!-- Trạng thái tải / kết thúc — hiển thị bên dưới danh sách -->
					<div id="notifications-status" class="notifications-status is-hidden" aria-live="polite"></div>
				</section>
			</section>
		</main>
	</div>

	<!-- create-post-modal injected by assets/js/components/create-post-modal.js -->

	<script type="module" src="../assets/js/components/sidebar.js"></script>
	<script type="module" src="../assets/js/pages/notifications.js"></script>
</body>
</html>
