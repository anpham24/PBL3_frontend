<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUTraveler - Trang chủ</title>



	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../assets/css/global.css">
	<link rel="stylesheet" href="../assets/css/feed.css">
</head>

<body>
	<div class="app-shell">
		<aside class="sidebar">
			<h1 class="brand">DUTraveler</h1>

			<nav class="side-nav" aria-label="Sidebar navigation">
				<a class="nav-item active" href="feed.html">
					<i class="bx bx-home-alt-2"></i>
					<span class="nav-label">Trang chủ</span>
				</a>

				<a class="nav-item create-post-link" href="feed.html">
					<i class="bx bx-plus-circle"></i>
					<span class="nav-label">Tạo bài đăng</span>
				</a>

				<a class="nav-item" href="profile.html">
					<i class="bx bx-user"></i>
					<span class="nav-label">Trang cá nhân</span>
				</a>

				<a class="nav-item" href="notifications.html">
					<i class="bx bx-bell"></i>
					<span class="nav-label">Thông báo</span>
				</a>

				<a class="nav-item" href="settings.html">
					<i class="bx bx-cog"></i>
					<span class="nav-label">Cài đặt</span>
				</a>
			</nav>
		</aside>

		<main class="main-content">
			<header class="top-header">
				<div class="header-inner">
					<div class="search-wrap">
						<label class="search-box" for="search-input">
							<i class="bx bx-search"></i>
							<input id="search-input" type="search" placeholder="Tìm kiếm">
						</label>
					</div>
				</div>
			</header>

			<section class="main-inner">
				<div class="feed-page">
					<div class="feed-tabs" role="tablist" aria-label="Lọc bảng tin">
						<button id="feed-tab-explore" class="feed-tab is-active" type="button" data-feed-mode="EXPLORE"
							role="tab" aria-selected="true">
							Khám phá
						</button>
						<button id="feed-tab-following" class="feed-tab" type="button" data-feed-mode="FOLLOWING"
							role="tab" aria-selected="false">
							Đang theo dõi
						</button>
					</div>

					<div class="feed-filters">
						<label class="filter-chip" for="province-filter">
							<i class="bx bx-map"></i>
							<select id="province-filter" class="filter-select" aria-label="Lọc theo tỉnh">
								<option value="ALL">Tất cả tỉnh</option>
							</select>
						</label>

						<label class="filter-chip" for="topic-filter">
							<i class="bx bx-star"></i>
							<select id="topic-filter" class="filter-select" aria-label="Lọc theo chủ đề">
								<option value="ALL">Tất cả chủ đề</option>
							</select>
						</label>
					</div>

					<div id="feed-post-list" class="post-list"></div>
					<p id="feed-empty-state" class="placeholder-card empty is-hidden">Không có bài viết phù hợp với bộ
						lọc hiện tại.</p>
					<p id="feed-status" class="feed-status is-hidden" role="status" aria-live="polite"></p>
				</div>
			</section>
		</main>
	</div>

	<!-- create-post-modal injected by assets/js/components/create-post-modal.js -->

	<!-- comment-modal injected by assets/js/components/comment-modal.js -->

	<div id="report-post-modal" class="report-post-modal is-hidden" aria-hidden="true" role="dialog" aria-modal="true"
		aria-labelledby="report-post-title">
		<div class="report-post-dialog">
			<header class="report-post-header">
				<h2 id="report-post-title">Báo cáo bài đăng</h2>
				<button id="report-post-close" class="report-post-close" type="button" aria-label="Đóng">
					<i class="bx bx-x"></i>
				</button>
			</header>

			<form id="report-post-form" class="report-post-form" novalidate>
				<p class="report-post-subtitle">Chọn lý do bạn muốn báo cáo bài đăng này.</p>

				<label class="report-reason-option">
					<input type="radio" name="report-reason" value="SPAM" required>
					<span>Spam hoặc quảng cáo không mong muốn</span>
				</label>

				<label class="report-reason-option">
					<input type="radio" name="report-reason" value="HARASSMENT" required>
					<span>Quấy rối hoặc ngôn từ thù ghét</span>
				</label>

				<label class="report-reason-option">
					<input type="radio" name="report-reason" value="MISINFORMATION" required>
					<span>Thông tin sai lệch</span>
				</label>

				<label class="report-reason-option">
					<input type="radio" name="report-reason" value="COPYRIGHT" required>
					<span>Vi phạm bản quyền</span>
				</label>

				<label class="report-reason-option">
					<input type="radio" name="report-reason" value="OTHER" required>
					<span>Lý do khác</span>
				</label>

				<p id="report-post-feedback" class="report-post-feedback is-hidden" role="status" aria-live="polite">
				</p>

				<div class="report-post-actions">
					<button id="report-post-cancel" class="report-post-btn report-post-cancel"
						type="button">Hủy</button>
					<button id="report-post-submit" class="report-post-btn report-post-submit"
						type="submit">Gửi</button>
				</div>
			</form>
		</div>
	</div>

	<script type="module" src="../assets/js/components/sidebar.js"></script>
	<script type="module" src="../assets/js/pages/feed.js"></script>
</body>

</html>
