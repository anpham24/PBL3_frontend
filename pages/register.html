<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUTraveler - Đăng ký</title>
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="../assets/css/global.css">
	<link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="login-page">
	<form id="register-form" class="login-wrapper" aria-label="Form đăng ký DUTraveler" novalidate>
		<h1 class="logo">DU<span>Traveler</span></h1>

		<div class="field">
			<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
				<path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M4 20C4.96 16.93 7.93 15 12 15C16.07 15 19.04 16.93 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
			<input id="register-username" name="username" type="text" placeholder="Tên đăng nhập" autocomplete="username" required>
		</div>

		<div class="field">
			<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
				<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z" stroke="currentColor" stroke-width="1.8"/>
				<path d="M8 8.5h8M8 12h8M8 15.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
			</svg>
			<input id="register-nickname" name="nickname" type="text" placeholder="Nickname" autocomplete="nickname" required>
		</div>

		<div class="field">
			<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
				<rect x="3" y="5" width="14" height="10" rx="2" transform="translate(1 1)" stroke="currentColor" stroke-width="1.8"/>
				<path d="M4 8l8 5 8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
			<input id="register-email" name="email" type="email" placeholder="Email" autocomplete="email" required>
		</div>

		<div class="field">
			<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
				<rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
				<path d="M8 11V8.5C8 6.01 10.01 4 12.5 4C14.99 4 17 6.01 17 8.5V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
			</svg>
			<input id="register-password" name="password" type="password" placeholder="Mật khẩu" autocomplete="new-password" required>
		</div>

		<p id="register-feedback" class="is-hidden" role="status" aria-live="polite"></p>

		<button id="register-submit" class="login-button" type="submit">Đăng ký</button>

		<p class="account-footer">
			Bạn đã có tài khoản?
			<a href="login.html">Đăng nhập</a>
		</p>
	</form>

	<script type="module" src="../assets/js/pages/register.js"></script>
</body>
</html>
