<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUTraveler - Cài đặt</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="../assets/css/global.css">
	<link rel="stylesheet" href="../assets/css/settings.css">
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar">
			<h1 class="brand">DUTraveler</h1>

			<nav class="side-nav" aria-label="Sidebar navigation">
				<a class="nav-item" href="feed.html">
					<i class="bx bx-home-alt-2"></i>
					<span class="nav-label">Trang chủ</span>
				</a>

				<a class="nav-item create-post-link" href="feed.html">
					<i class="bx bx-plus-circle"></i>
					<span class="nav-label">Tạo bài đăng</span>
				</a>

				<a class="nav-item" href="profile.html">
					<i class="bx bx-user"></i>
					<span class="nav-label">Trang cá nhân</span>
				</a>

				<a class="nav-item" href="notifications.html">
					<i class="bx bx-bell"></i>
					<span class="nav-label">Thông báo</span>
				</a>

				<a class="nav-item active" href="settings.html">
					<i class="bx bx-cog"></i>
					<span class="nav-label">Cài đặt</span>
				</a>
			</nav>
		</aside>

		<main class="main-content">
			<header class="top-header">
				<div class="header-inner">
					<div class="search-wrap">
						<label class="search-box" for="search-input">
							<i class="bx bx-search"></i>
							<input id="search-input" type="search" placeholder="Tìm kiếm">
						</label>
					</div>
				</div>
			</header>

			<section class="main-inner">
				<section class="settings-page" aria-label="Cài đặt tài khoản">
					<div id="settings-main" class="settings-subview">
						<h2 class="settings-title">Cài đặt</h2>

						<div class="settings-list">
							<button class="settings-item" type="button" data-action="edit-profile">
								<span class="settings-item-left">
									<i class="bx bx-user"></i>
									<span>Chỉnh sửa trang cá nhân</span>
								</span>
								<i class="bx bx-chevron-right settings-arrow"></i>
							</button>

							<button class="settings-item" type="button" data-action="change-password">
								<span class="settings-item-left">
									<i class="bx bx-lock-alt"></i>
									<span>Đổi mật khẩu</span>
								</span>
								<i class="bx bx-chevron-right settings-arrow"></i>
							</button>

							<button class="settings-item settings-logout-item" type="button" data-action="logout">
								<span class="settings-item-left">
									<i class="bx bx-log-out"></i>
									<span>Đăng xuất</span>
								</span>
							</button>
						</div>
					</div>

					<div id="settings-edit-profile" class="settings-subview is-hidden">
						<button class="settings-back-btn" type="button" data-action="back-to-main">
							<i class="bx bx-arrow-back"></i>
							<span>Quay lại</span>
						</button>
						<h3 class="settings-subtitle">Chỉnh sửa trang cá nhân</h3>

						<form id="settings-edit-profile-form" class="settings-form" action="#" method="post">
							<div class="settings-avatar-row">
								<img id="settings-avatar-preview" class="settings-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=60" alt="Ảnh đại diện hiện tại">
								<button id="settings-avatar-change" class="settings-avatar-change" type="button">Thay đổi ảnh đại diện</button>
							</div>

							<input id="settings-avatar-file" name="avatarFile" type="file" accept="image/*" hidden>
							<p class="settings-avatar-hint">Nhấn vào ảnh hiện tại hoặc nút thay đổi để tải ảnh mới từ máy tính.</p>

							<div class="field-group">
								<label for="settings-nickname">Tên nick (nickname)</label>
								<input id="settings-nickname" name="nickname" type="text" placeholder="duyen.travel">
							</div>

							<div class="field-group">
								<label for="settings-bio">Tiểu sử (Bio)</label>
								<textarea id="settings-bio" name="bio" rows="4" placeholder="Travel storyteller"></textarea>
							</div>

							<p id="settings-edit-feedback" class="settings-feedback is-hidden" role="status" aria-live="polite"></p>
							<button id="settings-edit-submit" class="settings-submit-btn" type="submit">Lưu thay đổi</button>
						</form>
					</div>

					<div id="settings-change-password" class="settings-subview is-hidden">
						<button class="settings-back-btn" type="button" data-action="back-to-main">
							<i class="bx bx-arrow-back"></i>
							<span>Quay lại</span>
						</button>
						<h3 class="settings-subtitle">Đổi mật khẩu</h3>

						<form id="settings-change-password-form" class="settings-form" action="#" method="post">
							<div class="field-group">
								<label for="settings-old-password">Mật khẩu cũ</label>
								<input id="settings-old-password" name="oldPassword" type="password" placeholder="••••••••">
							</div>

							<div class="field-group">
								<label for="settings-new-password">Mật khẩu mới</label>
								<input id="settings-new-password" name="newPassword" type="password" placeholder="••••••••">
							</div>

							<div class="field-group">
								<label for="settings-confirm-password">Xác nhận mật khẩu mới</label>
								<input id="settings-confirm-password" name="confirmPassword" type="password" placeholder="••••••••">
							</div>

							<p id="settings-password-feedback" class="settings-feedback is-hidden" role="status" aria-live="polite"></p>
							<button id="settings-password-submit" class="settings-submit-btn" type="submit">Cập nhật mật khẩu</button>
						</form>
					</div>
				</section>
			</section>
		</main>
	</div>

	<div id="create-post-modal" class="create-post-modal" aria-hidden="true" role="dialog" aria-modal="true">
		<div class="create-post-dialog">
			<div id="step-1-upload" class="modal-step">
				<div class="upload-dropzone">
					<i class="bx bx-images" aria-hidden="true"></i>
					<p>Chọn nhiều ảnh để bắt đầu tạo bài đăng mới</p>
					<button id="choose-file-btn" class="choose-file-btn" type="button">Chọn từ máy tính</button>
					<input type="file" id="post-file-input" accept="image/*" multiple hidden>
				</div>
			</div>

			<div id="step-2-details" class="modal-step is-hidden">
				<header class="create-modal-header">
					<button id="close-create-modal" class="modal-close-btn" type="button" aria-label="Đóng">
						<i class="bx bx-x"></i>
					</button>
					<h2 id="create-post-title">Tạo bài đăng</h2>
					<button id="publish-post-btn" class="publish-btn" type="button">Đăng</button>
				</header>

				<form id="create-post-form" class="create-modal-body" novalidate>
					<div class="create-detail-top">
						<img class="detail-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=96&q=60" alt="Avatar người dùng">

						<div class="detail-chips">
							<label class="detail-chip detail-chip-select" for="create-post-visibility">
								<i class="bx bx-lock-alt"></i>
								<select id="create-post-visibility" aria-label="Quyền riêng tư bài đăng" required>
									<option value="PUBLIC">Công khai</option>
									<option value="PRIVATE">Chỉ mình tôi</option>
								</select>
							</label>
						</div>
					</div>

					<div class="post-caption-wrap">
						<textarea id="post-caption-input" placeholder="Viết chú thích cho bài đăng..."></textarea>
					</div>

					<div class="post-caption-wrap">
						<input id="create-post-address" type="text" placeholder="Địa chỉ cụ thể" required autocomplete="off">
					</div>

					<div class="draft-preview">
						<div id="post-draft-preview-grid" class="draft-preview-grid"></div>
					</div>

					<p id="create-post-feedback" class="create-post-feedback is-hidden" role="status" aria-live="polite"></p>
				</form>
			</div>
		</div>
	</div>

	<script src="../assets/js/utils/sidebar-role.js"></script>
	<script type="module" src="../assets/js/pages/settings.js"></script>
</body>
</html>
